name: convoyeur_mobile
description: "Application mobile convoyeur - PFE"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── State Management ────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ──────────────────────────────────
  go_router: ^14.2.7

  # ── REST API ────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ── GraphQL ─────────────────────────────────────
  graphql_flutter: ^5.2.0

  # ── Local Storage ───────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # ── Environment ─────────────────────────────────
  flutter_dotenv: ^5.2.1

  # ── Utilities ───────────────────────────────────
  dartz: ^0.10.1
  equatable: ^2.0.5
  intl: ^0.20.2

  # ── Models / Serialization ──────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── URL Launcher ────────────────────────────────
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ── Code Generation ─────────────────────────────
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - .env.production
    - assets/images/logo.png